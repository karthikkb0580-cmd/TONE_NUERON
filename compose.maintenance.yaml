services:
  maintenance:
    image: tone_nueron-backend:latest

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - /bin/sh
      - -c
      - |
        while true; do
          if python -m backend.scripts.cleanup; then
            sleep 86400
          else
            sleep 300
          fi
        done
