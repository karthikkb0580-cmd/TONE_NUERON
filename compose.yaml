services:
  postgres:
    image: postgres:17
    container_name: tone_neuron_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: tone_neuron
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tone_neuron_db

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tone_neuron -d tone_neuron_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: